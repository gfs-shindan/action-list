<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="証券口座への入金のしかたを、証券会社ごとに案内するページ">
<meta property="og:title" content="GFS 入金ガイド">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gfs-shindan.github.io/action-list/deposit/">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GFS 入金ガイド</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>

:root{
  --bg:#eef3f2; --surface:#ffffff; --sunk:#f5f8f7; --ink:#14211f; --muted:#5a6b68; --line:#d8e2e0;
  --teal:#00857a; --teal-ink:#ffffff; --teal-soft:#dff1ee;
  --amber:#a8650a; --amber-soft:#f8ecd6;
  --rose:#b4473c; --rose-soft:#f8e3df;
  --chart-up:#00857a; --chart-down:#b4473c;
  --tech:#2f6fd6; --tech-soft:#e3ecfb; --fund:#d9741c; --fund-soft:#fbeadb;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1716; --surface:#16211f; --sunk:#111b1a; --ink:#e6efed; --muted:#97a8a5; --line:#2a3937;
  --teal:#3dc2b2; --teal-ink:#06201d; --teal-soft:#123230;
  --amber:#e7a650; --amber-soft:#33281a; --rose:#ec8a7e; --rose-soft:#3a201d;
  --chart-up:#3dc2b2; --chart-down:#ec8a7e; --tech:#7fa9f0; --tech-soft:#1a2a45; --fund:#f0a463; --fund-soft:#3a2716; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#16211f; --sunk:#111b1a; --ink:#e6efed; --muted:#97a8a5; --line:#2a3937;
  --teal:#3dc2b2; --teal-ink:#06201d; --teal-soft:#123230;
  --amber:#e7a650; --amber-soft:#33281a; --rose:#ec8a7e; --rose-soft:#3a201d;
  --chart-up:#3dc2b2; --chart-down:#ec8a7e; --tech:#7fa9f0; --tech-soft:#1a2a45; --fund:#f0a463; --fund-soft:#3a2716; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
a{color:var(--teal)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.4}
.muted{color:var(--muted)}
.small{font-size:13px}


.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px;padding-block:12px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid transparent}
.bar.scrolled{border-bottom-color:var(--line)}
.bar .brand{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:.04em}
.bar .brand b{color:var(--teal)}
@media (max-width:400px){.bar .brand .bt{display:none}}
.bar .sp{flex:1}
.iconbtn{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.iconbtn[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}


.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding-block:18px 8px}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.ring .num small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:4px;letter-spacing:.06em}
.hero h1{font-size:22px}
.hero p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tally{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.chip.req{background:var(--teal-soft);color:var(--teal)}
.chip.opt{background:var(--amber-soft);color:var(--amber)}
.chip.done{background:var(--teal);color:var(--teal-ink)}
.chip.todo{background:var(--rose-soft);color:var(--rose)}
.chip.none{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}

.next{margin-block:14px 6px;background:var(--teal);color:var(--teal-ink);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-decoration:none;border:0;width:100%;text-align:left}
.next .eyebrow{font-size:11px;letter-spacing:.12em;font-weight:700;opacity:.85}
.next .t{font-family:var(--f-display);font-weight:900;font-size:18px;line-height:1.4}
.next .arrow{grid-row:1/3;grid-column:2;font-size:22px}
.next.allclear{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

.brokerline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-block:10px 0}
.brokerline select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:3px 6px}


.section-h{display:flex;align-items:baseline;gap:8px;margin-block:26px 10px}
.section-h h2{font-size:15px}
.track{list-style:none;margin:0;padding:0;position:relative}
.track::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:2px;background:var(--line)}
.track li+li{margin-top:8px}
.trow{position:relative;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 0;}
.trow:hover{border-color:var(--teal)}
.dot{width:40px;height:40px;display:grid;place-items:center;position:relative;margin-left:-1px}
.dot span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:13px;background:var(--surface);border:2px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.trow.is-done .dot span{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.trow.is-todo .dot span{border-color:var(--rose);color:var(--rose)}
.trow .tt{min-width:0}
.trow .tt b{display:block;font-weight:700;font-size:15px;line-height:1.45}
.trow .tt small{color:var(--muted);font-size:12px}


.back{border:0;background:none;padding:4px 0;color:var(--muted);font-size:14px}
.dhead{padding-block:10px 4px;display:flex;flex-direction:column;gap:8px}
.dhead .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dhead h1{font-size:23px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-block:14px}
.qcard .q{font-weight:700;font-size:16px;line-height:1.6;margin:0 0 4px}
.qcard .note{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--line);background:var(--sunk);border-radius:12px;padding:12px 8px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.seg button[aria-pressed="true"].yes{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.seg button[aria-pressed="true"].no{border-color:var(--rose);background:var(--rose-soft);color:var(--rose)}
.seg button[aria-pressed="true"] .r{border-color:currentColor}
.seg button[aria-pressed="true"] .r::after{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}

.memo{border:1px dashed var(--amber);background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13px;margin-block:10px}
.memo b{color:var(--amber);font-size:11px;letter-spacing:.1em;display:block}

.cleared{display:flex;gap:14px;align-items:center;background:var(--teal-soft);border-radius:var(--r);padding:16px 18px;margin-block:4px 14px}
.cleared .ck{width:44px;height:44px;border-radius:50%;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;flex:none}
.cleared .ck svg{width:24px;height:24px}
.cleared .ck path{stroke-dasharray:30;stroke-dashoffset:0;animation:draw .5s ease-out}
@keyframes draw{from{stroke-dashoffset:30}}
.cleared b{font-family:var(--f-display);font-size:17px;display:block}

.howto{display:flex;flex-direction:column;gap:18px;margin-top:6px}
.howto>h2{font-size:17px;display:flex;align-items:center;gap:8px}
.howto>h2::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--rose)}
.block{display:flex;flex-direction:column;gap:10px}
.block>h3{font-size:15px}
.lead{margin:0}

.brokers{display:grid;gap:10px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bcard.main{border-width:2px}
.bcard.sub{background:var(--sunk);padding:10px 14px}
.bcard.mine{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.bcard .bh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bcard .bh h3{font-size:17px}
.bcard.sub .bh h3{font-size:15px}
.bcard ul{margin:0;padding-left:1.2em;font-size:14px}
.bcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;text-decoration:none;border:1.5px solid var(--teal);color:var(--teal);background:var(--surface);min-height:40px}
.btn.fill{background:var(--teal);color:var(--teal-ink)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn .ext{font-size:11px;opacity:.7}
.btn.vid::before{content:"";width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.pr{font-size:11.5px;color:var(--muted);margin:0}

.points{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.points h3{font-size:14px;display:flex;gap:6px;align-items:center;color:var(--amber);margin-bottom:6px}
.points ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.points li{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:14px;line-height:1.6}
.points li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--amber);margin-top:.6em;transform:rotate(45deg)}
.points .key{background:linear-gradient(transparent 62%,var(--amber-soft) 62%);font-weight:700}

.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:16px}
.steps li:not(:last-child)::after{content:"";position:absolute;left:16px;top:34px;bottom:2px;width:2px;background:var(--line)}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-variant-numeric:tabular-nums}
.steps li.on::before{background:var(--teal);color:var(--teal-ink)}
.steps .st b{display:block;line-height:1.5;padding-top:5px}
.steps .st p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.steps .tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;background:var(--amber-soft);color:var(--amber);padding:2px 8px;border-radius:6px}
.form-mock{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.form-mock div{display:grid;grid-template-columns:88px 1fr;border-top:1px solid var(--line)}
.form-mock div:first-child{border-top:0}
.form-mock span{padding:6px 10px}
.form-mock span:first-child{background:var(--sunk);color:var(--muted)}
.form-mock span:last-child{font-weight:700}

.vcard{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-decoration:none;color:var(--ink)}
.vcard .thumb{aspect-ratio:16/10;max-width:100%;border-radius:8px;background:linear-gradient(135deg,var(--teal),color-mix(in srgb,var(--teal) 40%,var(--ink)));display:grid;place-items:center}
.vcard .thumb::after{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.vcard.alt .thumb{background:linear-gradient(135deg,var(--amber),color-mix(in srgb,var(--amber) 40%,var(--ink)))}
.vcard b{display:block;line-height:1.5;font-size:14.5px}
.vcard small{color:var(--muted);font-size:12.5px;line-height:1.55;display:block;margin-top:2px}
.vcard .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--teal)}
.vcard.alt .lbl{color:var(--amber)}

.worry{display:flex;flex-direction:column;gap:8px}
.worry button.w{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700}
.worry button.w[aria-expanded="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.worry button.w .pm{flex:none;font-size:18px;line-height:1}
.ans{background:var(--surface);border:1px solid var(--line);border-left:0;border-radius:0 0 12px 12px;margin-top:-12px;padding:16px 14px 14px;font-size:14px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--teal);border-top:0}
.ans p{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two>div{background:var(--sunk);border-radius:10px;padding:10px;font-size:13px}
.two>div b{display:block;font-size:14px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.flow span{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.flow i{font-style:normal;color:var(--muted)}

.lens{display:grid;gap:10px}
.lcard{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.lcard svg{width:96px;height:64px;max-width:100%;background:var(--sunk);border-radius:8px}
.lcard b{display:block}
.lcard p{margin:0;font-size:13.5px;color:var(--muted)}

.selfcheck{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.selfcheck h3{font-size:14px}
.selfcheck label{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.selfcheck input{width:20px;height:20px;accent-color:var(--teal);flex:none;margin-top:2px}
.selfcheck .verdict{font-size:13.5px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--sunk);color:var(--muted)}
.selfcheck .verdict.ok{background:var(--teal-soft);color:var(--teal)}
.selfcheck textarea{font:inherit;font-size:14px;width:100%;min-height:72px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sunk);color:var(--ink);resize:vertical}

.bubbles{display:flex;flex-wrap:wrap;gap:8px}
.bubbles span{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:6px 12px;font-size:13.5px}
.cycle{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.cycle div{background:var(--sunk);border-radius:10px;padding:10px 4px;font-family:var(--f-display);font-weight:900;font-size:15px}
.cycle div.hl{background:var(--teal);color:var(--teal-ink)}
.cycle small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;opacity:.8}

.fork{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.fork-h b{font-family:var(--f-display);font-size:16px;display:block}
.fork-h small{color:var(--muted);font-size:12.5px}
.fork-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fork-opts button{border:2px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.fork-opts button svg{width:100%;max-width:120px;height:44px;border-radius:6px;background:var(--surface);margin-bottom:4px}
.fork-opts button b{font-size:15px;line-height:1.4}
.fork-opts button small{font-size:11.5px;color:var(--muted);line-height:1.5}
.fork-opts button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.fork-opts button[aria-pressed="true"] b{color:var(--teal)}
.fork-opts button[aria-pressed="true"] b::before{content:"✓ "}
.fork-diag{border:0;width:100%;text-align:left;cursor:pointer;font-size:13px;font-weight:700;text-decoration:none;display:flex;justify-content:space-between;gap:8px;background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 12px}
.fork.set{border-style:solid;border-color:var(--teal)}
.subh{font-size:12.5px;color:var(--muted);font-weight:700;margin-block:16px 8px;display:flex;align-items:center;gap:8px}
.subh::after{content:"";flex:1;height:1px;background:var(--line)}
.trow.dim{opacity:.62}
.stylebar{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:13.5px}
.stylebar.mine{background:var(--teal-soft)}
.stylebar .fork-opts button svg{display:none}
.txt{font:inherit;font-size:14px;width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink)}
.kw{font-family:var(--f-body);font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.bq{background:var(--surface);border:2px solid var(--teal);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.bq-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted)}
.bq-top b{font-family:var(--f-display);font-size:14px;color:var(--teal)}
.bq-bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bq-bar i{display:block;height:100%;background:var(--teal);transition:width .3s}
.bq h3{font-size:18px;line-height:1.5}
.bq-opts{display:flex;flex-direction:column;gap:8px}
.bq-opts button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 14px;font-weight:700;font-size:15px;line-height:1.45}
.bq-opts button small{font-weight:500;font-size:12px;color:var(--muted)}
.bq-opts button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.bq-opts button:active{transform:scale(.98)}
.bq-nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 0;text-decoration:underline}
.bq-res h3{font-size:19px}
.bq-res p{margin:0;font-size:14.5px}
.bq-sum{margin:0;padding:10px 12px 10px 1.6em;background:var(--sunk);border-radius:10px;font-size:13.5px}
.bq-cands{display:grid;gap:8px}
.bq-cands button{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:700}
.bq-cands button small{display:block;font-weight:500;font-size:12px;color:var(--muted)}

.dhead{padding-top:18px}
.dhead h1{font-size:30px}
.dhead+.swb{margin-top:14px}
.swb .swb-opts{grid-template-columns:repeat(4,minmax(0,1fr))}
.howto{gap:16px;margin-top:14px}
.dgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.dstep{font-size:16px;display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dstep span{font-family:var(--f-body);font-size:11.5px;font-weight:900;letter-spacing:.06em;background:var(--teal);color:var(--teal-ink);border-radius:999px;padding:2px 10px}
.dcol .brokers{grid-template-columns:repeat(2,minmax(0,1fr))}
.dcol .brokers .bcard.mine{grid-column:1/-1}
a.next.solo-next{max-width:620px;margin:32px 0 0 auto}
}

@media (min-width:1024px) and (hover:hover) and (pointer:fine){
.app{zoom:1.15}
.toast{font-size:16px;padding:12px 20px}
}
@media (min-width:1400px) and (hover:hover) and (pointer:fine){
.app{zoom:1.3}
}

const MAIN_ALIAS={rakuten:["楽天","楽天証券","らくてん","rakuten"],sbi:["SBI","SBI証券","SBIネオモバイル","ネオモバ"],monex:["マネックス","マネックス証券","monex"]};
function normName(x){return String(x||"").normalize("NFKC").toLowerCase().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/株式会社|\(株\)|[\s・\-ー_.]/g,"").replace(/(證券|証券|しょうけん)$/,"")}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function checkBroker(input){
  const q=normName(input);if(q.length<2)return {kind:"empty"};
  const cands=[...Object.entries(MAIN_ALIAS).map(([k,al])=>({main:k,name:BROKERS[k].name,keys:[BROKERS[k].name,...al]})),
               ...OTHER_BROKERS.map(b=>({b,name:b.name,keys:[b.name,...b.alias]}))];
  for(const c of cands)if(c.keys.some(k=>normName(k)===q))return c.main?{kind:"main",key:c.main}:{kind:"found",b:c.b};
  let best=null,bd=99;
  for(const c of cands)for(const k of c.keys){const nk=normName(k);if(nk.length<2)continue;
    let d=lev(q,nk);if(nk.length>=3&&(q.includes(nk)||nk.includes(q)))d=Math.min(d,1);
    if(d<bd){bd=d;best=c}}
  const nearOK=bd<=(q.length>=5?2:1);
  if(best&&nearOK)return best.main?{kind:"near",key:best.main,name:best.name}:{kind:"near",b:best.b,name:best.name};
  return {kind:"none"};
}

function buyGuide(){
  const card=(name,links,note)=>`<div class="buyg"><b class="small">${esc(name)}の買い方</b>${note?`<p class="small" style="margin:0;background:var(--amber-soft);border-radius:8px;padding:8px 10px">${note}。</p>`:""}<div class="acts">${links.join("")}</div></div>`;
  const B=BROKERS[S.broker];
  if(B)return card(B.name,[ext(B.buy,B.buyName,"fill"),B.buy2?ext(B.buy2,B.buy2Name,"ghost"):""],"")+(S.broker==="rakuten"?rakutenBuyFig():"");
  const k=isOther()?knownOther():null;
  if(k)return card(k.name,[k.buy?ext(k.buy,k.buyName?`${k.buyName}の買い方`:"株の買い方を見る","fill"):ext(k.url,"公式サイトを開く","fill")],k.buyNote||"");
  if(isOther())return `<p class="small muted" style="margin:0">「${esc(bname())} 株 買い方」で検索すると、手順のページが見つかります。</p>`;
  return `<div class="buyg"><b class="small">証券会社ごとの1株からの買い方</b><div class="acts">${Object.values(BROKERS).map(b=>ext(b.buy,`${b.name}：${b.buyName}`,"ghost")).join("")}</div></div>${rakutenBuyFig()}`;
}
const WORRIES=[
 ["pick","どの銘柄を選べばいいかわからない",()=>pickQuiz()],
 ["how","購入方法がわからない",()=>`<p>少額投資の買い方は2つあります。</p><div class="two"><div><b>1株ずつ買う</b>多くのネット証券で対応（会社によってはネットで買えないことも）</div><div><b>金額を指定して買う</b>いわゆる「100円株」。楽天証券・SMBC日興証券・PayPay証券などが対応</div></div><div class="flow"><span>アプリで「国内株式」</span><i>→</i><span>銘柄名・証券コード（会社ごとの4ケタの番号）で検索</span><i>→</i><span>金額（株数）を入力</span><i>→</i><span>取引パスワードで注文</span></div><p class="small muted">取引パスワード（取引暗証番号とも呼ばれます）は、ログインパスワードとは別のものです。1-3で用意したものを使います。</p>${buyGuide()}`],
 ["fear","失敗して損をするのが怖い",()=>`<p>100円株などの少額から始めれば、損失も最小限です。実際に売買すると値動きの感覚がつかめます。<b>小さく試すことが理解への一番の近道</b>です。</p>`],
 ["other","上の3つに当てはまらない",()=>`<p>その他のお悩みは、LINEで専任コンサルタントに直接ご相談ください。</p>`]
];
function b5(){
  return `${kabuGuide("まずは動画を1本見て、1株か100円から買ってみましょう。手が止まったら、下の「どこで止まっていますか？」から選んでください",false)}
  <div class="block"><h3>まずは1本、動画を見て買ってみる</h3>
   <a class="vcard" href="${LINKS.firstBuy}" target="_blank" rel="noopener"><span class="thumb"></span><span><span class="lbl">これ1本でOK</span><b>少額投資のはじめかた</b><small>1株／金額指定の2種類、銘柄選びの考え方、購入の実演（楽天カブピタ）までカバー。</small></span></a>
   ${!S.broker||S.broker==="rakuten"?`<div class="vcard alt vcard-2"><span class="thumb"></span><span><span class="lbl">楽天証券の方向け・ライブ講義アーカイブ</span><b>楽天証券で株を買う操作を一緒にやってみよう</b><small>「かぶミニ」「かぶピタッ」で少額から買う流れを一緒に進めます。</small></span>
     <div class="acts">${ext(LINKS.rakutenLiveHisshu,"必修講義を受講中の方はこちら","fill")}${ext(LINKS.rakutenLive,"GFSの講義ページから見る","ghost")}</div>
     <p class="small muted">必修講義を受講中の方は、GFSの講義ページからは見られません。上のボタンから見てください。</p></div>`:""}</div>
  <div class="block"><h3>どこで止まっていますか？</h3>
   <div class="worry">${WORRIES.map(([k,t,f])=>`<button class="w" data-worry="${k}" aria-expanded="${S.worry===k}"><span>${t}</span><span class="pm">${S.worry===k?"−":"＋"}</span></button>${S.worry===k?`<div class="ans">${f()}</div>`:""}`).join("")}</div></div>
  ${orderTips()}`;
}

   <div class="acts"><button class="btn ghost" data-go="t3">1-3 入金のページを見る</button></div>
   ${points([
     `注文画面で <span class="key">口座の区分</span>（特定口座＝税金の計算を証券会社がしてくれる口座／NISAの成長投資枠）を聞かれたら、どちらでもOK<br><span class="small muted">NISAで買うと、値上がりした分などに税金がかかりません</span>`,
     `<span class="key">注文してもすぐに買えない</span>ことがあります<br><span class="small muted">1株ずつの注文は、次の取引の始まりの値段でまとめて買う会社が多いです。すぐに出てこなくても大丈夫です</span>`,
     `少額の売買でも、<span class="key">手数料などがかかる</span>ことがあります<br><span class="small muted">注文画面の金額を確かめてから注文しましょう</span>`

    ${open?`<div class="world" style="top:1130px"><small>WORLD 3</small>分析で実践${w3new?`<span class="new">NEW</span>`:""}</div>`

}
function sheet(id){
  const close=`<button class="x" data-sheet="" aria-label="閉じる">×</button>`;
  if(id==="broker"){swOpen=true;const p=switchBroker();swOpen=false;return `<div class="sheet-bg" data-sheet=""></div><div class="sheet" role="dialog" aria-label="メインの証券会社">${close}<span class="eb">メインの証券会社</span><h2>証券会社を切り替える</h2>${p.replace('class="swb"','class="swb" style="background:none;padding:0"').replace(/<div class="swb-bar">[\s\S]*?<\/div>/,"")}</div>`}
  if(id==="fork")return `<div class="sheet-bg" data-sheet=""></div><div class="sheet" role="dialog" aria-label="分かれ道">${close}
    <span class="eb">WORLD 3 ・ 分かれ道</span><h2>どっちのルートに進む？</h2>
    <p class="small muted" style="margin:0">選んだルートのステージが光ります。あとから変えられて、もう一方のルートにも行けます。</p>
    ${styleOpts(false)}
    <button class="fork-diag" data-go="style"><span>${sdDone()?`診断結果：${sdDoneLabel()}（もう一度見る）`:"迷ったら：投資スタイル診断（22問・約5分）"}</span><span>→</span></button></div>`;
  if(GOALS[id]){const g=GOALS[id],ok=goalDone(id),left=g.need.filter(x=>S.ans[x]!=="yes"),T=x=>TASKS.find(t=>t.id===x);
    return `<div class="sheet-bg" data-sheet=""></div><div class="sheet ${ok?"win":""}" role="dialog" aria-label="ゴール ${g.title}">${close}
    <div class="duo">${kabuImg("tech","hop")}${kabuImg("fund","hop")}</div>
    <span class="eb">WORLD ${g.world} ・ GOAL</span><h2>${ok?`${g.title} 達成！`:g.title}</h2>
    <p style="margin:0">${ok?g.msg:`このゴールまで、あと${left.length}ステージです。`}</p>
    ${!ok?`<div class="quest"><b>残りのステージ</b>${left.map(x=>`${STAGE_NO[x]} ${T(x).title}`).join("<br>")}</div>`:""}
    ${ok&&id==="g2"?`<div class="quest"><b>NEW WORLD</b>WORLD 3「分析で実践」が現れました！講義で学んだ分析を使って、もう一歩進んでみましょう（任意）。</div>`:""}
    <div class="btns">${ok?`<button class="btn fill" data-sheet="">マップに戻る</button>`:`<button class="btn fill" data-stage="${left[0]}">${STAGE_NO[left[0]]}に進む</button>`}</div></div>`}
  const t=TASKS.find(x=>x.id===id),st=status(t);

   <div class="sk">${kabuImg(t.style||S.style||(TASKS.indexOf(t)%2?"fund":"tech"),st==="yes"?"":"hop")}<div><span class="eb">STAGE ${STAGE_NO[id]}</span><h2>${t.title}</h2><span class="chip ${t.req?"req":"opt"}">${t.req?"必須":"任意"}</span> ${st==="yes"?`<span class="chip done">クリア済み</span>`:""}</div></div>
   ${t.style&&S.style&&t.style!==S.style?`<p class="small muted" style="margin:0">あなたが選んだのとは別のルートのステージです。両方試すと、自分に合う方がはっきりします。</p>`:""}
   <div class="quest"><b>ミッション</b>${t.q}${id==="t2"?`<br><span class="small muted">申し込みまで終わっていれば、クリアにしてOKです</span>`:""}</div>
   ${memoOf(id)?`<div class="quest"><b>マイメモ</b><span style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(memoOf(id))}</span></div>`:""}
   <button class="memolink" data-memogo="${id}">${PEN}${memoOf(id)?"メモを書き足す":"メモを書く"}</button>
   <div class="btns">${st==="yes"
     ?`<button class="btn" data-go="${id}">内容をもう一度見る</button>`
     :`${id==="t1"?brokerLaunch():""}<button class="btn ${id==="t1"?"":"fill"}" data-clear="${id}">もうできた！クリアにする</button><button class="btn" data-guide="${id}">攻略を見る（${t.no}）</button>`}</div></div>`;
}
function home(){return S.ui==="list"?listHome():gameMap()}
const PEN=`<svg class="memo-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
const memoOf=id=>(S.memos&&S.memos[id]||"").trim();
const memoCount=()=>TASKS.filter(t=>memoOf(t.id)).length;
function memoCard(t){const m=S.memos[t.id]||"";

function memoText(){return ["【GFS アクションリスト マイメモ】",...TASKS.filter(t=>memoOf(t.id)).map(t=>`■${STAGE_NO[t.id]} ${t.title}（${status(t)==="yes"?"クリア":"まだ"}）\n${memoOf(t.id)}`)].join("\n\n")}
function memosView(){

  ${list.length?`<div class="memolist">${list.map(t=>`<div class="memoitem"><div class="h"><b>${S.ui==="list"?TASKS.indexOf(t)+1+".":STAGE_NO[t.id]} ${t.title}</b><button class="memolink" data-memogo="${t.id}">開く</button></div><p>${esc(memoOf(t.id))}</p></div>`).join("")}</div>
   <div class="selfcheck" style="margin-top:14px"><button class="btn fill" id="memoCopy">まとめてコピー</button><textarea id="memoCopyBox" readonly hidden aria-label="コピー用のメモ"></textarea></div>`

}
function listHome(){

    return `<li><button class="trow ${dim===true?"dim":""} ${s==="yes"?"is-done":s==="no"?"is-todo":""}" data-go="${t.id}"><span class="dot"><span>${s==="yes"?"✓":i}</span></span><span class="tt"><b>${t.title}</b><small>${s==="yes"?"完了":s==="no"?"進め方を確認中":"未回答"}${memoOf(t.id)?"・メモあり":""}</small></span><span class="chip ${t.req?"req":"opt"}">${t.req?"必須":t.style?STYLES[t.style].label.replace("ファンダメンタルズ","ファンダ"):"任意"}</span></button></li>`};

let sdHost=null;
function syncSdTheme(){if(!sdHost)return;const t=document.documentElement.getAttribute("data-theme");t?sdHost.setAttribute("data-theme",t):sdHost.removeAttribute("data-theme")}
function styleHost(){
  if(sdHost)return sdHost;
  sdHost=document.createElement("div");sdHost.className="sd-host";
  const root=sdHost.attachShadow({mode:"open"});
  root.appendChild(document.getElementById("sdTpl").content.cloneNode(true));
  syncSdTheme();new MutationObserver(syncSdTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  GFS_mountStyleCheck(root,{kabu:KABU,close:()=>go("home"),
    apply:(key,r)=>{S.style=key;S.sdLast={key,pa:r.pa,pb:r.pb};save();go("home");const f=$(".fork");f&&f.scrollIntoView({block:"center"});toast(`診断結果（${STYLES[key].label}）で実践します`)}});
  return sdHost;
}

let bkHost=null,bkApp=null;
function brokerHost(){
  if(bkHost)return bkHost;
  bkHost=document.createElement("div");bkHost.className="bk-host";
  const root=bkHost.attachShadow({mode:"open"});
  root.appendChild(document.getElementById("bkTpl").content.cloneNode(true));
  bkApp=GFS_mountBrokerCheck(root,{kabu:KABU,
    decided:()=>{S.ans.t1="yes";save()},
    chosen:k=>{S.broker=k;S.ans.t1="yes";save()},
    next:()=>{justCleared="t1";go(S.ui==="list"?"t2":"home")}
  });
  return bkHost;
}
function brokerLaunch(){return `<button class="bk-launch" data-go="broker"><span class="duo">${kabuImg("tech")}${kabuImg("fund")}</span><span><b>証券口座タイプ診断で決める</b><small>3つの質問に答えると、合いそうな候補がわかります（約1分）</small></span></button>`}
function sdDone(){return !!(S.sdLast&&STYLES[S.sdLast.key])}
function sdDoneLabel(){const r=S.sdLast;return `${STYLES[r.key].type}（${r.key==="tech"?"テクニカル "+r.pa:"ファンダメンタルズ "+r.pb}%）`}


let current="home";
const WIDE=matchMedia("(min-width:900px)");
WIDE.addEventListener("change",()=>render(true));
function twoCols(){
  const h=$(".howto"),kids=[...h.children].slice(1),i=kids.findIndex(e=>e.classList.contains("block"));if(i<1)return;
  const col=(n,t)=>{const d=document.createElement("div");d.className="dcol";d.innerHTML=`<h3 class="dstep"><span>STEP ${n}</span>${t}</h3>`;return d};
  const L=col(1,"入金の前に準備する"),R=col(2,"入金する");
  kids.slice(0,i).forEach(e=>L.appendChild(e));kids.slice(i).forEach(e=>R.appendChild(e));
  L.querySelectorAll(".say,.selfcheck p,.selfcheck div").forEach(e=>{if(e.children.length===0)e.textContent=e.textContent.replace("下の手順","右の手順")});
  const g=document.createElement("div");g.className="dgrid";g.append(L,R);h.appendChild(g);
}
function render(keepScroll){
  $("#view").innerHTML=`<div class="dhead"><div class="meta"><span class="chip req">入金ガイド</span></div><h1>証券口座に入金する</h1></div>
  ${switchBroker()}
  <section class="howto"><h2>進め方</h2>${b3()}</section>
  <a class="next solo-next" href="../"><span class="eyebrow">入金できたら</span><span class="t">GFS アクションリストで、少額で投資家デビュー</span><span class="arrow">→</span></a>`;
  if(WIDE.matches)twoCols();
  if(!keepScroll)window.scrollTo(0,0);
}
function go(id){current=id||"home";sheetId="";swOpen=false;try{history.replaceState(null,"",id&&id!=="home"?"#"+id:location.pathname+location.search)}catch(e){}render()}
function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2200)}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g&&g.dataset.go){go(g.dataset.go);return}
  const a=e.target.closest("[data-ans]");
  if(a){const t=TASKS.find(x=>x.id===current);const v=a.dataset.ans;S.ans[t.id]=S.ans[t.id]===v?"":v;if(S.ans[t.id]==="yes")justCleared=t.id;save();render(true);
    if(S.ans[t.id]==="yes")toast(`「${t.title}」を完了にしました`);
    if(S.ans[t.id]==="no")setTimeout(()=>{const h=$(".howto");h&&h.scrollIntoView({behavior:"smooth",block:"start"})},50);return}
  const b=e.target.closest("[data-broker]");
  if(b){S.broker=b.dataset.broker;S.ans.t1="yes";save();if(b.dataset.sw){swFlash=true;swOpen=isOther();if(sheetId==="broker"&&!isOther())sheetId=""}render(true);if(b.dataset.sw){swFlash=false;const m=$(".bcard.mine");m&&m.scrollIntoView({behavior:"smooth",block:"center"})}toast(isOther()&&!S.brokerName?"「その他の証券会社」にしました。会社名を入れてください":`メイン口座を${bname()}にしました`);return}
  const sy=e.target.closest("[data-style]");
  if(sy){const k=sy.dataset.style;S.style=S.style===k?"":k;save();render(true);if(S.style)toast(`${STYLES[k].label}で実践します`);return}
  const pqb=e.target.closest("[data-pq]");
  if(pqb){S.pq=[...(S.pq||[]),pqb.dataset.pq].slice(0,PQ.length);save();render(true);return}
  if(e.target.closest("[data-pqback]")){S.pq=(S.pq||[]).slice(0,-1);save();render(true);return}
  if(e.target.closest("[data-pqretry]")){S.pq=[];save();render(true);return}
  const w=e.target.closest("[data-worry]");
  if(w){S.worry=S.worry===w.dataset.worry?"":w.dataset.worry;save();render(true);return}
  const st=e.target.closest("[data-step]");
  if(st){const i=+st.dataset.step,arr=S.checks.t4||[];S.checks.t4=arr.includes(i)?arr.filter(x=>x!==i):[...arr,i];save();render(true);return}
  const on=e.target.closest("[data-oname]");
  if(on){S.brokerName=on.dataset.oname;if(!isOther())S.broker="other";S.ans.t1="yes";swFlash=true;save();render(true);swFlash=false;toast(`メイン口座を${bname()}にしました`);return}
  const po=e.target.closest("[data-pracopen]");
  if(po){pracOpen=po.dataset.pracopen==="1";render(true);return}
  const zi=e.target.closest("[data-zoomimg]");
  if(zi){const src=zi.querySelector("img").src,d=document.createElement("div");d.className="zoomwrap";d.innerHTML=`<button class="x" aria-label="閉じる">×</button><img src="${src}" alt="">`;d.addEventListener("click",ev=>{if(ev.target.closest(".x")||ev.target===d)d.remove()});document.body.appendChild(d);d.querySelector(".x").focus();return}
  const so=e.target.closest("[data-swopen]");
  if(so){swOpen=!swOpen;render(true);return}
  const mg=e.target.closest("[data-memogo]");
  if(mg){go(mg.dataset.memogo);setTimeout(()=>{const m=$("#mymemo");if(m){m.scrollIntoView({behavior:"smooth",block:"center"});const ta=m.querySelector("textarea");ta&&ta.focus({preventScroll:true})}},60);return}
  if(e.target.id==="memoCopy"){const t=memoText(),box=$("#memoCopyBox"),b=e.target;
    const fb=()=>{box.value=t;box.hidden=false;box.select();b.textContent="下の文を選択してコピーしてください"};
    try{navigator.clipboard.writeText(t).then(()=>{b.textContent="コピーしました"},fb)}catch(err){fb()}return}
  const u=e.target.closest("[data-ui]");
  if(u){S.ui=u.dataset.ui;sheetId="";save();go("home");return}
  const sh=e.target.closest("[data-stage]");
  if(sh){sheetId=sh.dataset.stage;render(true);const x=$(".sheet .x");x&&x.focus();return}
  const sc=e.target.closest("[data-sheet]");
  if(sc){sheetId=sc.dataset.sheet;render(true);return}
  const cl=e.target.closest("[data-clear]");
  if(cl){const id=cl.dataset.clear;S.ans[id]="yes";justCleared=id;sheetId="";save();render(true);
    const n=$(`.stage[data-stage="${id}"]`);n&&n.scrollIntoView({block:"center",behavior:"smooth"});toast("STAGE CLEAR!");justCleared="";return}
  const gd=e.target.closest("[data-guide]");
  if(gd){const id=gd.dataset.guide;S.ans[id]="no";sheetId="";save();go(id);setTimeout(()=>{const h=$(".howto");h&&h.scrollIntoView({behavior:"smooth",block:"start"})},60);return}
  if(e.target.id==="memoBtn"){S.memo=!S.memo;save();render(true);return}
  if(e.target.id==="reset"){
    if(e.target.dataset.armed){S={memos:S.memos,ui:S.ui,ans:{},broker:"",brokerName:"",style:"",memo:S.memo,checks:{},notes:{},worry:""};save();render();toast("回答をリセットしました")}
    else{e.target.dataset.armed="1";e.target.textContent="もう一度押すとリセット";setTimeout(()=>{if(e.target.isConnected){delete e.target.dataset.armed;e.target.textContent="回答をリセット"}},3000)}
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="otherName"){const k=knownOther();if(k)S.brokerName=k.name;save();if(isOther())render(true);return}
  if(e.target.id==="brokerSel"){S.broker=e.target.value;if(S.broker)S.ans.t1="yes";save();render(true);return}
  const sc=e.target.closest("[data-sc]");
  if(sc){const id=sc.dataset.sc;S.checks[id]=[...sc.querySelectorAll("input:checked")].map(x=>+x.dataset.i);save();render(true)}
});
document.addEventListener("toggle",e=>{if(e.target.id==="fundGuide"){S.fundOpen=e.target.open;save()}},true);
document.addEventListener("input",e=>{if(e.target.id==="otherName"){S.brokerName=e.target.value.trim();save();clearTimeout(otherT);otherT=setTimeout(()=>{const h=$("#otherHint");if(h)h.innerHTML=otherHint()},250);return}if(e.target.dataset&&e.target.dataset.memo){S.memos[e.target.dataset.memo]=e.target.value;save();const st=$("#memoSt");if(st)st.textContent="保存しました（この端末のブラウザに保存されます）";return}if(e.target.id==="otherName"){S.brokerName=e.target.value.trim();save();return}if(e.target.id==="t9-note"){S.notes.t9=e.target.value;save()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetId){sheetId="";render(true)}});
window.addEventListener("scroll",()=>$("#bar").classList.toggle("scrolled",scrollY>4),{passive:true});
function fromDiagnosis(h){
  if(!STYLES[h])return false;
  S.style=h;save();current="home";render();
  const f=$(".fork");f&&f.scrollIntoView({block:"center"});
  toast(`診断結果（${STYLES[h].label}）を反映しました`);
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  return true;
}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(fromDiagnosis(h))return;current=TASKS.some(t=>t.id===h)||["style","memos","broker"].includes(h)?h:"home";render()});

const h0=location.hash.slice(1);
if(!fromDiagnosis(h0)){if(TASKS.some(t=>t.id===h0)||["style","memos","broker"].includes(h0))current=h0;render();}
})();
</script>

</body>
</html>
